version: "3.9"

services:
  experiment:
    build:
      context: .
      dockerfile: Dockerfile
    image: column_generation
    command: python3 experiment.py
    volumes:
      - /~/.gurobi/gurobi.lic:/opt/gurobi/gurobi.lic:ro
      - /~/pici/results:/code/outputs
    # restart: unless-stopped
    container_name: experiment_container